services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: requestdesk
      POSTGRES_PASSWORD: requestdesk
      POSTGRES_DB: requestdesk
    ports:
      - "54330:5432"
    volumes:
      - requestdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requestdesk -d requestdesk"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://requestdesk:requestdesk@db:5432/requestdesk
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: RequestDesk!2026
      SESSION_SECRET: request-desk-local-demo-secret
      STATIC_DIR: /app/static
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  requestdesk_pg:
